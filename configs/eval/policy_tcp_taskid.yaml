camera:
  resize_hw: [240, 320]

policy:
  cache_length: 28
  state_fields:
    - tcp_pose
    - force
    - task_id  # From --task (default: 0), appended as the last scalar state feature.
  expected_state_dim: 13

control:
  gripper_sticky: 0
  continuous_gripper: false
  force_fz_limit: -7.5

recording:
  image_save_fn: tmp_saved_video.mp4
